<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一個沒有其他人的島嶼｜內省智能互動遊戲</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#183b39;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:660px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#52736b}.track{height:7px;background:#dce8df;border-radius:9px;margin:12px 0 25px;overflow:hidden}.bar{height:100%;background:#2d7a65;transition:.2s}.panel{background:white;border:1px solid #dce6de;border-radius:20px;padding:24px;box-shadow:0 8px 24px #123d2810}h1{font-size:28px;line-height:1.3;margin:0 0 12px}h2{font-size:22px;margin:0 0 12px}p{line-height:1.8}small,.hint{color:#61746c}.scenario{padding:16px;border-radius:12px;background:#eff6f1;margin:14px 0;line-height:1.8}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.choice{background:white;border:1.5px solid #cbdcd1;border-radius:12px;padding:14px 9px;text-align:center;font-size:15px;color:#20483e;cursor:pointer}.choice.on{background:#e1f2e8;border-color:#26745d;font-weight:700}.choice:focus-visible,button:focus-visible{outline:3px solid #f0b95e}textarea{width:100%;border:1.5px solid #cbdcd1;border-radius:12px;min-height:90px;padding:12px;font:inherit;resize:vertical;margin:9px 0 16px}label{display:block;margin-top:18px;font-weight:650}button.primary{background:#216a56;color:white;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;width:100%;cursor:pointer;margin-top:12px}button.secondary{background:transparent;border:1px solid #8eaaa0;border-radius:12px;padding:11px 18px;color:#245748;cursor:pointer;margin-top:10px}.error{color:#a33a35;font-size:14px;min-height:22px}.summary{background:#f4f8f5;border-radius:12px;padding:15px;margin:12px 0}.summary strong{display:block;margin-bottom:7px}.foot{font-size:13px;color:#65796d;margin-top:20px;line-height:1.6}.tag{display:inline-block;background:#e0eee5;color:#235d4b;border-radius:50px;padding:5px 11px;font-size:13px;margin-bottom:12px}@media(max-width:370px){.options{grid-template-columns:1fr}}@media print{.top,.track,.actions{display:none}.panel{box-shadow:none;border:0}}</style></head><body><main class="wrap"><div class="top"><span>沒有其他人的島嶼 · 內省智能</span><span id="progress">準備開始</span></div><div class="track"><div class="bar" id="bar" style="width:0%"></div></div><section class="panel" id="app"></section><div class="foot">這是課堂體驗活動，沒有標準答案，也不會依回答判斷智能高低。所有答案只保存在目前的瀏覽器頁面，不會上傳伺服器；關閉或重新整理頁面後可能遺失。</div></main><script>
const ITEMS=['三本自己挑選的書','音樂播放器與耳機','一本空白手帳與一盒彩色筆','一封來自重要之人的親筆信與一本照片集','一台相機','一套自己最喜歡的運動裝備'];
const FEEL=['放鬆','開心','無聊','孤單','焦慮','期待','不捨','平靜','其他'];
const NEED=['休息','娛樂','陪伴','記錄生活','整理心情','熟悉感','自由安排時間','其他'];
let step=0;const answers={initial:[],first:'',why:'',scenes:[]};const app=document.getElementById('app');const progress=document.getElementById('progress');const bar=document.getElementById('bar');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choices(arr,name,multi=false){return `<div class="options" role="group" aria-label="${esc(name)}">${arr.map(v=>`<button type="button" class="choice" data-group="${name}" data-value="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join('')}</div>`}
function bindChoices(){app.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.group;const all=[...app.querySelectorAll(`.choice[data-group="${g}"]`)];const multi=g==='items';if(multi){const selected=all.filter(x=>x.classList.contains('on'));if(!b.classList.contains('on')&&selected.length>=3){err('最多選擇三項物品。');return}}else all.forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false');err('')}))}
function selected(g){return [...app.querySelectorAll(`.choice[data-group="${g}"].on`)].map(x=>x.dataset.value)}
function err(s){const e=document.getElementById('err');if(e)e.textContent=s}
function layout(html){progress.textContent=step===0?'準備開始':step===5?'我的回顧':`第 ${step} / 4 階段`;bar.style.width=(step/5*100)+'%';app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});bindChoices()}
function next(){step++;render()}
function scene(title,body,question){layout(`<span class="tag">情境 ${step-1} / 3</span><h2>${title}</h2><div class="scenario">${body}</div><label>這時候你最接近哪一種感受？</label>${choices(FEEL,'feeling')}<label>你覺得自己現在最需要什麼？</label>${choices(NEED,'need')}<label>你現在最想使用哪項物品？</label>${choices(ITEMS,'item')}<label>${question}</label><textarea id="reason" placeholder="用自己的話寫一兩句就好"></textarea><p id="err" class="error" aria-live="polite"></p><button class="primary" id="go">記錄並繼續</button>`);document.getElementById('go').onclick=()=>{const f=selected('feeling')[0],n=selected('need')[0],i=selected('item')[0],r=document.getElementById('reason').value.trim();if(!f||!n||!i||!r){err('請選擇感受、需求、物品，並寫下原因。');return}answers.scenes.push({title,feeling:f,need:n,item:i,reason:r});next()}}
function render(){if(step===0){layout(`<span class="tag">15 分鐘課堂活動</span><h1>如果你要在一座沒有其他人的島嶼生活一個月</h1><p>你將到一座沒有其他人的島嶼生活一個月。島上有基本的食物、飲水及住宿，但沒有網路，也無法與外界聯絡。</p><p>你會在不同的生活情境中做出選擇，並記錄自己的感受與原因。答案沒有對錯，也不需要讓其他人知道。</p><button class="primary" id="go">開始</button>`);document.getElementById('go').onclick=next;return}
if(step===1){layout(`<span class="tag">出發前</span><h2>你會帶哪三項物品？</h2><p>從以下六項中選出三項。假設電子設備可以正常使用一個月。</p>${choices(ITEMS,'items',true)}<label>如果只能留下一項，你最想保留哪一項？</label><div id="firstOptions" class="options"><small>請先選好三項物品</small></div><label>為什麼想保留它？</label><textarea id="reason" placeholder="例如：這讓我能記錄每天的心情……"></textarea><p id="err" class="error" aria-live="polite"></p><button class="primary" id="go">確認選擇</button>`);app.querySelectorAll('[data-group="items"]').forEach(b=>b.addEventListener('click',()=>{const a=selected('items');document.getElementById('firstOptions').innerHTML=a.map(v=>`<button type="button" class="choice" data-group="first" data-value="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join('')||'<small>請先選好三項物品</small>';bindChoices()}));document.getElementById('go').onclick=()=>{const a=selected('items'),f=selected('first')[0],r=document.getElementById('reason').value.trim();if(a.length!==3||!f||!r){err('請選滿三項物品，選出最想保留的一項，並寫下原因。');return}answers.initial=a;answers.first=f;answers.why=r;next()};return}
if(step===2){scene('島上第三天','你已經在島上生活三天。每天都可以自由安排時間，但沒有人能和你說話。今天下午，你覺得時間過得特別慢，開始想念平常的生活。','為什麼現在想使用這項物品？');return}
if(step===3){scene('島上第十五天','你逐漸習慣島上的生活。沒有課業、工作或社群媒體需要處理，每天都能自己決定要做什麼。你發現自己有很多時間，可以做平常沒空做的事。','和第三天相比，你的想法有什麼不同？如果沒有改變，也可以寫下原因。');return}
if(step===4){scene('離開前一天','明天你就能回到原本的生活，重新見到家人和朋友，也要開始面對課業、工作與日常安排。你可以從六項物品中帶走一項作為這段生活的紀念。','你為什麼想帶走這項物品？這和出發前的想法有什麼關係？');return}
if(step===5){const changed=answers.first!==answers.scenes[2].item;layout(`<span class="tag">活動完成</span><h1>回顧你的選擇</h1><div class="summary"><strong>出發前</strong>選擇的三項：${answers.initial.map(esc).join('、')}<p>最想保留：${esc(answers.first)}<br>原因：${esc(answers.why)}</p></div>${answers.scenes.map(s=>`<div class="summary"><strong>${esc(s.title)}</strong><p>感受：${esc(s.feeling)}<br>需求：${esc(s.need)}<br>物品：${esc(s.item)}<br>原因：${esc(s.reason)}</p></div>`).join('')}<div class="scenario">${changed?'你最後想保留的物品和出發前不同。可以想想：是什麼讓你的選擇改變？':'你最後想保留的物品和出發前相同。可以想想：這項物品對你的意義有沒有改變？'}</div><h2>回顧問題</h2><p>① 哪個情境讓你最有感受？<br>② 你最初以為自己需要的，和後來發現的一樣嗎？<br>③ 你能說明自己為什麼維持或改變選擇嗎？</p><h2>連結 Gardner 的內省智能</h2><p>Gardner 在〈個人智能：內省和人際智能〉中提到，內省智能與辨識自身感受有關。從區分基本的愉快與痛苦，到察覺較複雜、細緻的情緒，並用語言或其他方式表達自己的內在經驗。</p><div class="summary"><strong>① 辨識自己的感受</strong><p>回頭看第三天、第十五天和離開前一天：你選了哪些情緒？你能區分「無聊」、「孤單」或「焦慮」的不同嗎？</p></div><div class="summary"><strong>② 理解感受背後的原因</strong><p>你選擇某件物品，是因為喜歡它的用途，還是因為它能回應當時的需求？你的理由是否隨情境改變？</p></div><div class="summary"><strong>③ 說明自己的內在經驗</strong><p>試著完成這句話：「當我＿＿＿＿時，我感到＿＿＿＿，因為我其實需要＿＿＿＿。」</p></div><p><strong>最後想一想：</strong>你能清楚說出自己在不同時候的感受，以及這些感受為什麼出現嗎？</p><p class="hint">理論依據：Gardner，〈個人智能：內省和人際智能〉，課程閱讀資料第十章。這是練習認識自己的活動，沒有標準答案，也不會依回答判斷智能高低。</p><div class="actions"><button class="primary" id="copy">複製我的紀錄</button><button class="secondary" id="restart">重新開始</button><p id="err" class="error" aria-live="polite"></p></div>`);document.getElementById('copy').onclick=async()=>{const t=['沒有其他人的島嶼｜我的選擇紀錄',`出發前：${answers.initial.join('、')}；最想保留：${answers.first}；原因：${answers.why}`,...answers.scenes.map(s=>`${s.title}：感受 ${s.feeling}；需求 ${s.need}；物品 ${s.item}；原因 ${s.reason}`)].join('\n');try{await navigator.clipboard.writeText(t);err('已複製紀錄。')}catch(e){const area=document.createElement('textarea');area.value=t;app.append(area);area.select();document.execCommand('copy');area.remove();err('已嘗試複製紀錄。')}};document.getElementById('restart').onclick=()=>location.reload()}}
render();
</script></body></html>
